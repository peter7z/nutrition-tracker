name: Bocado Log validation

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a production rollout halfway through a revision update.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:test-only-password@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Install locked test dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Test ownership, persistence, idempotency and assistant contracts
        run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: Deploy official Cloud Run service
    needs: backend
    if: github.repository == 'peter7z/nutrition-tracker' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      BOCADO_DEPLOY_ACCOUNT: bocado-github-deploy@bocado-511619.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authenticate to Google Cloud without service account keys
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: bocado-511619
          workload_identity_provider: projects/929368612596/locations/global/workloadIdentityPools/bocado-github/providers/github-main
          service_account: ${{ env.BOCADO_DEPLOY_ACCOUNT }}
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Build, deploy tested commit and check health
        run: bash deploy/cloud-run.sh

  ios:
    # Keep the job definition for later; skip it to avoid macOS runner charges.
    if: false
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select an installed Xcode with Swift 6.2 support
        run: |
          python3 - <<'PY'
          import glob, os, re
          candidates = []
          for path in glob.glob('/Applications/Xcode_*.app'):
              match = re.fullmatch(r'/Applications/Xcode_(\d+)(?:\.(\d+))?(?:\.(\d+))?\.app', path)
              if match and int(match[1]) >= 26:
                  candidates.append((tuple(int(x or 0) for x in match.groups()), path))
          if not candidates:
              raise SystemExit('Xcode 26 or later is required for the project actor-isolation settings')
          _, path = max(candidates)
          print('Selected Xcode:', path)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('DEVELOPER_DIR=' + path + '/Contents/Developer\n')
          PY
      - name: Inspect the selected Xcode and available runtimes
        run: |
          xcodebuild -version
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/simulators.json') as f:
              devices = json.load(f)['devices']
          candidates = [(runtime, device) for runtime, values in devices.items() if '.iOS-' in runtime for device in values if device.get('isAvailable') and device['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No available iOS Simulator runtime on this runner')
          candidates.sort(key=lambda item: (tuple(int(x) for x in item[0].split('.iOS-')[-1].split('-')), item[1]['name']), reverse=True)
          runtime, device = candidates[0]
          print('Selected simulator:', device['name'], runtime)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('NUTRITION_SIMULATOR_ID=' + device['udid'] + '\n')
          PY
      - name: Run unit and UI acceptance tests on isolated local data
        run: |
          xcodebuild -project ios/Bocado.xcodeproj -scheme NutritionTracker \
            -configuration Debug -destination "platform=iOS Simulator,id=$NUTRITION_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/NutritionTrackerDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/NutritionTrackerTests.xcresult" \
            -parallel-testing-enabled NO -collect-test-diagnostics never -testLanguage en -testRegion US \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY="-" test
      - name: Build Release for iOS
        run: |
          xcodebuild -project ios/Bocado.xcodeproj -scheme NutritionTracker \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/NutritionTrackerRelease" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Validate the bundled privacy manifest
        run: plutil -lint "$RUNNER_TEMP/NutritionTrackerRelease/Build/Products/Release-iphoneos/Bocado.app/PrivacyInfo.xcprivacy"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/NutritionTrackerTests.xcresult
          if-no-files-found: warn
          retention-days: 7
