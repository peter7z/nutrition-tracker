services:
  - type: web
    name: nutrition-tracker-api
    runtime: python
    region: virginia
    plan: free
    branch: main
    rootDir: backend
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt -c requirements-lock.txt
    startCommand: uvicorn app.asgi:app --host 0.0.0.0 --port $PORT --no-access-log --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /healthz
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.13
      - key: NUTRITION_PUBLIC_URL
        value: https://nutrition-tracker-api-cljy.onrender.com
      - key: NUTRITION_ENV
        value: production
      - key: APPLE_APP_ID
        value: com.pedrozunino.bocado
      - key: DATABASE_URL
        fromDatabase:
          name: nutrition-tracker-db
          property: connectionString

databases:
  - name: nutrition-tracker-db
    plan: free
    region: virginia
    postgresMajorVersion: "16"
    ipAllowList: []
