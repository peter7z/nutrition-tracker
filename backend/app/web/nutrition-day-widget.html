<div id="nutrition-day-widget" lang="es">
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 8px 10px; color: CanvasText; background: transparent; }
    .card { max-width: 520px; padding: 12px; border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 16px; background: color-mix(in srgb, Canvas 96%, CanvasText 4%); }
    .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 15px; font-weight: 650; }
    .date, .muted { color: color-mix(in srgb, CanvasText 68%, transparent); font-size: 12px; }
    .calories { display: flex; align-items: baseline; gap: 6px; margin-top: 10px; }
    .calories strong { color: #35a779; font-size: 30px; line-height: 1; letter-spacing: -.04em; }
    .calories span { color: color-mix(in srgb, CanvasText 72%, transparent); font-size: 13px; }
    .progress-track { height: 6px; margin-top: 9px; overflow: hidden; border-radius: 99px; background: color-mix(in srgb, CanvasText 16%, transparent); }
    .progress-fill { height: 100%; width: 0; border-radius: inherit; background: #35a779; transition: width .2s ease; }
    .goal-line { margin-top: 6px; color: color-mix(in srgb, CanvasText 72%, transparent); font-size: 12px; }
    .nutrients { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
    .metric { min-width: 0; padding: 8px; border-radius: 10px; background: color-mix(in srgb, CanvasText 7%, transparent); }
    .metric-label { color: color-mix(in srgb, CanvasText 72%, transparent); font-size: 11px; }
    .metric-value { margin-top: 3px; font-size: 14px; font-weight: 600; white-space: nowrap; }
    .metric:nth-child(1) { border-top: 2px solid #5b9bf5; }
    .metric:nth-child(2) { border-top: 2px solid #e5a63b; }
    .metric:nth-child(3) { border-top: 2px solid #e57987; }
    .metric:nth-child(4) { border-top: 2px solid #35a779; }
    .foot { display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; }
    .notice { margin-top: 10px; padding: 8px 9px; border-radius: 10px; background: color-mix(in srgb, #e5a63b 18%, Canvas); color: CanvasText; font-size: 12px; }
    @media (max-width: 420px) { .nutrients { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  </style>
  <article class="card" aria-live="polite" aria-busy="true">
    <div class="top"><h1 id="title">Resumen del día</h1><span class="date" id="date"></span></div>
    <div class="calories"><strong id="energy">—</strong><span>kcal</span></div>
    <div id="goal-wrap" hidden>
      <div class="progress-track" role="progressbar" aria-label="Progreso de calorías" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" id="progress"></div></div>
      <div class="goal-line" id="goal-line"></div>
    </div>
    <div class="nutrients">
      <div class="metric"><div class="metric-label" id="protein-label">Proteínas</div><div class="metric-value" id="protein">—</div></div>
      <div class="metric"><div class="metric-label" id="carbohydrates-label">Carbohidratos</div><div class="metric-value" id="carbohydrates">—</div></div>
      <div class="metric"><div class="metric-label" id="fat-label">Grasas</div><div class="metric-value" id="fat">—</div></div>
      <div class="metric"><div class="metric-label" id="fiber-label">Fibra</div><div class="metric-value" id="fiber">—</div></div>
    </div>
    <div id="notice" class="notice" hidden></div>
    <div class="foot"><span class="muted" id="entries"></span><span class="muted" id="source"></span></div>
  </article>
  <script>
    (() => {
      const root = document.getElementById('nutrition-day-widget');
      const $ = (id) => document.getElementById(id);
      const reportHeight = () => {
        window.openai?.notifyIntrinsicHeight?.(document.documentElement.scrollHeight);
      };
      const applyTheme = (theme) => {
        if (theme === 'dark' || theme === 'light') document.documentElement.style.colorScheme = theme;
      };
      applyTheme(window.openai?.theme);
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(() => requestAnimationFrame(reportHeight)).observe(root);
      }
      window.addEventListener('load', reportHeight, { once: true });
      const locale = (document.documentElement.lang || 'es-UY').toLowerCase().startsWith('es') ? 'es-UY' : 'en-US';
      const copy = locale.startsWith('es')
        ? { title: 'Resumen del día', protein: 'Proteínas', carbohydrates: 'Carbohidratos', fat: 'Grasas', fiber: 'Fibra', progress: 'Progreso de calorías', pending: 'El total del día está pendiente de conciliación.', unavailable: 'El total de calorías no está disponible.', meals: (n) => `${n} ${n === 1 ? 'comida registrada' : 'comidas registradas'}`, goal: (used, target, pct) => `${used} de ${target} kcal · ${pct}% del objetivo`, manual: 'Consumo registrado', historical: 'Resumen del día' }
        : { title: 'Daily summary', protein: 'Protein', carbohydrates: 'Carbs', fat: 'Fat', fiber: 'Fiber', progress: 'Calorie progress', pending: 'The daily total needs reconciliation.', unavailable: 'Daily calories are unavailable.', meals: (n) => `${n} ${n === 1 ? 'meal logged' : 'meals logged'}`, goal: (used, target, pct) => `${used} of ${target} kcal · ${pct}% of goal`, manual: 'Logged intake', historical: 'Daily summary' };
      root.lang = locale;
      $('title').textContent = copy.title;
      $('protein-label').textContent = copy.protein;
      $('carbohydrates-label').textContent = copy.carbohydrates;
      $('fat-label').textContent = copy.fat;
      $('fiber-label').textContent = copy.fiber;
      document.querySelector('[role="progressbar"]').setAttribute('aria-label', copy.progress);
      const number = (value, maxDigits = 0) => value == null || !Number.isFinite(Number(value))
        ? '—'
        : new Intl.NumberFormat(locale, { maximumFractionDigits: maxDigits }).format(Number(value));
      const kcal = (value) => value == null ? '—' : number(value);

      function render(result) {
        const output = result?.structuredContent ?? result;
        const day = output?.day_summary ?? output;
        if (!day || typeof day !== 'object') return;
        const totals = day.totals ?? {};
        const goals = day.goals ?? {};
        const target = Number(goals.energy ?? goals.goals?.energy ?? goals.targets?.energy);
        const energy = totals.energy;
        if (day.day) {
          const [year, month, date] = day.day.split('-').map(Number);
          $('date').textContent = new Intl.DateTimeFormat(locale, { dateStyle: 'medium' }).format(new Date(year, month - 1, date, 12));
        } else {
          $('date').textContent = '';
        }
        $('energy').textContent = kcal(energy);
        for (const key of ['protein', 'carbohydrates', 'fat', 'fiber']) {
          $(key).textContent = totals[key] == null ? '—' : `${number(totals[key], 1)} g`;
        }
        const goalWrap = $('goal-wrap');
        if (Number.isFinite(target) && target > 0 && energy != null && Number.isFinite(Number(energy))) {
          const used = Number(energy);
          const pct = Math.round(used / target * 100);
          goalWrap.hidden = false;
          $('goal-line').textContent = copy.goal(number(used), number(target), pct);
          $('progress').style.width = `${Math.min(100, Math.max(0, pct))}%`;
          goalWrap.querySelector('[role="progressbar"]').setAttribute('aria-valuenow', String(Math.min(100, pct)));
        } else {
          goalWrap.hidden = true;
        }
        const notice = $('notice');
        if (day.needs_reconciliation) {
          notice.hidden = false;
          notice.textContent = copy.pending;
        } else if (energy == null) {
          notice.hidden = false;
          notice.textContent = copy.unavailable;
        } else {
          notice.hidden = true;
          notice.textContent = '';
        }
        $('entries').textContent = copy.meals(Array.isArray(day.entries) ? day.entries.length : 0);
        $('source').textContent = day.intake_selection === 'historical' ? copy.historical : copy.manual;
        root.querySelector('article').setAttribute('aria-busy', 'false');
        requestAnimationFrame(reportHeight);
      }

      const initial = window.openai?.toolOutput;
      if (initial) render(initial);
      window.addEventListener('message', (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (message?.jsonrpc === '2.0' && message.method === 'ui/notifications/host-context-changed') {
          applyTheme(message.params?.hostContext?.theme);
          requestAnimationFrame(reportHeight);
        }
        if (message?.jsonrpc === '2.0' && message.method === 'ui/notifications/tool-result') {
          render(message.params);
        }
      }, { passive: true });
    })();
  </script>
</div>
